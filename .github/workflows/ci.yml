name: SnowID Extension

on:
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      publish_images:
        description: "Whether to publish images to Docker Hub"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validate
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🚀 Setup PGRX
        uses: ./.github/actions/setup-pgrx
        with:
          pg-major: 18
          cache-key: validate-pg18-v5

      - parallel:
          - name: 🎨 Format
            run: cargo fmt --all -- --check

          - name: 🔎 Lint
            run: cargo clippy --profile release -- -D warnings

          - name: 🧪 Test
            run: cargo pgrx test pg18 --profile release

  package:
    name: 📦 Package (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}

    strategy:
      fail-fast: false
      matrix:
        pg_major: [ 18 ]
        arch: [ amd64, arm64 ]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🚀 Setup PGRX
        uses: ./.github/actions/setup-pgrx
        with:
          pg-major: ${{ matrix.pg_major }}
          cache-key: ${{ matrix.arch }}-package-pg${{ matrix.pg_major }}-v5

      - name: 🔨 Build Extension
        run: cargo pgrx package --profile release

      - name: 🧪 Test Packaged SQL Files
        if: ${{ matrix.arch == 'amd64' }}
        env:
          PG_SNOWID_PACKAGE_DIR: target/release/pg_snowid-pg${{ matrix.pg_major }}
        run: cargo test --test packaged_sql_files -- --ignored --nocapture

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pg-snowid-package-${{ matrix.pg_major }}-${{ matrix.arch }}
          path: target/release/pg_snowid-pg${{ matrix.pg_major }}/
          retention-days: 1

  build_and_push:
    name: 🐳 Build and Publish
    if: ${{ inputs.publish_images }}
    needs: [ validate, package ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_provider: [ pg, cloudnative-pg ]
        pg_version:
          - { major: 18, minor: 1, is_latest: false }
          - { major: 18, minor: 2, is_latest: false }
          - { major: 18, minor: 3, is_latest: false }
          - { major: 18, minor: 4, is_latest: true }

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download AMD64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: pg-snowid-package-${{ matrix.pg_version.major }}-amd64
          path: artifacts/amd64/

      - name: 📥 Download ARM64 Artifact
        uses: actions/download-artifact@v8
        with:
          name: pg-snowid-package-${{ matrix.pg_version.major }}-arm64
          path: artifacts/arm64/

      - name: 🏷️ Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: rixl/snowid-${{ matrix.pg_provider }}
          tags: |
            type=raw,value=${{ matrix.pg_version.major }}.${{ matrix.pg_version.minor }}
            type=raw,value=${{ matrix.pg_version.major }},enable=${{ matrix.pg_version.is_latest }}

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to Docker Hub
        if: ${{ inputs.publish_images }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Build and Push
        uses: docker/build-push-action@v7
        with:
          file: ./images/${{ matrix.pg_provider }}/Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish_images == true }}
          build-args: |
            PG_MAJOR=${{ matrix.pg_version.major }}
            PG_MINOR=${{ matrix.pg_version.minor }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
